<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 记账</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 登录页 -->
  <div id="login-view" class="view hidden">
    <div class="login-card">
      <h1>AI 记账</h1>
      <p class="subtitle">输入密码进入</p>
      <input type="password" id="login-password" placeholder="网页密码" autocomplete="current-password">
      <button id="login-btn" class="btn-primary">登录</button>
      <p id="login-err" class="error"></p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main-view" class="view hidden">
    <!-- 顶栏：资产/负债 双 tab + 右侧趋势图标 -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="tab active" data-tab="assets">资产</button>
        <button class="tab" data-tab="liabilities">负债</button>
      </div>
      <button class="topbar-icon" id="go-report" title="报表">📈</button>
    </header>

    <!-- 汇总卡片 -->
    <div id="summary-card" class="summary-card"></div>

    <!-- 内容区 -->
    <div id="content" class="content"></div>
  </div>

  <!-- 底部导航（照抄口袋记账：资产/报表/账单/社区/更多，中间+记账） -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn active" data-nav="assets"><span class="nav-emoji">👛</span>资产</button>
    <button class="nav-btn" data-nav="report"><span class="nav-emoji">📊</span>报表</button>
    <button class="nav-btn nav-add" data-nav="add"><span class="nav-add-circle">＋</span></button>
    <button class="nav-btn" data-nav="entries"><span class="nav-emoji">📋</span>账单</button>
    <button class="nav-btn" data-nav="settings"><span class="nav-emoji">⚙️</span>设置</button>
  </nav>

  <!-- 录入弹层 -->
  <div id="entry-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-tabs">
        <button class="mtab" data-mtype="expense">支出</button>
        <button class="mtab" data-mtype="income">收入</button>
        <button class="mtab" data-mtype="transfer">转账</button>
        <button class="modal-close">×</button>
      </div>
      <div id="entry-body"></div>
    </div>
  </div>

  <!-- 通用表单弹窗 -->
  <div id="form-modal" class="modal hidden">
    <div class="modal-content">
      <div class="form-modal-head">
        <span id="form-modal-title">标题</span>
        <button class="modal-close" id="form-modal-close">×</button>
      </div>
      <div id="form-modal-body"></div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content confirm-box">
      <p id="confirm-text" class="confirm-text"></p>
      <div class="confirm-btns">
        <button id="confirm-cancel" class="btn-ghost">取消</button>
        <button id="confirm-ok" class="btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 全屏选项面板（自定义下拉） -->
  <div id="option-panel" class="option-panel hidden">
    <div class="op-panel-head">
      <span class="op-panel-title">选择</span>
      <button class="modal-close" id="op-panel-close">×</button>
    </div>
    <div class="op-panel-grid"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
</body>
</html>
