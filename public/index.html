<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 记账</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 登录页 -->
  <div id="login-view" class="view hidden">
    <div class="login-card">
      <h1>AI 记账</h1>
      <p class="subtitle">输入密码进入</p>
      <input type="password" id="login-password" placeholder="网页密码" autocomplete="current-password">
      <button id="login-btn" class="btn-primary">登录</button>
      <p id="login-err" class="error"></p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main-view" class="view hidden">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="topbar-tabs">
        <button class="tab active" data-tab="assets">资产</button>
        <button class="tab" data-tab="liabilities">负债</button>
        <button class="tab" data-tab="receivables">应收/应付</button>
        <button class="tab" data-tab="entries">账单</button>
        <button class="tab" data-tab="periodic">周期账</button>
        <button class="tab" data-tab="settings">设置</button>
      </div>
    </header>

    <!-- 汇总卡片 -->
    <div id="summary-card" class="summary-card"></div>

    <!-- 内容区 -->
    <div id="content" class="content"></div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-nav="assets">💰 资产</button>
      <button class="nav-btn" data-nav="entries">📋 账单</button>
      <button class="nav-btn" data-nav="add">➕ 记账</button>
      <button class="nav-btn" data-nav="periodic">🔄 周期</button>
      <button class="nav-btn" data-nav="settings">⚙️ 设置</button>
    </nav>
  </div>

  <!-- 录入弹层 -->
  <div id="entry-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-tabs">
        <button class="mtab" data-mtype="expense">支出</button>
        <button class="mtab" data-mtype="income">收入</button>
        <button class="mtab" data-mtype="transfer">转账</button>
        <button class="modal-close">×</button>
      </div>
      <div id="entry-body"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
